<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StarFire Technical Companion Report — KHET-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .tab-button.active { border-bottom: 4px solid #b91c1c; font-weight: 700; color: #b91c1c; }
        pre { font-size: 0.75rem; line-height: 1.4; }
        .hash { font-family: monospace; cursor: pointer; transition: color 0.2s; }
        .hash:hover { color: #b91c1c; }
    </style>
</head>
<body class="bg-gray-50">

<div class="max-w-7xl mx-auto p-6 md:p-8">

    <header class="text-center border-b pb-8 mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-red-700 flex items-center justify-center gap-3">
            <span>🔥</span> STARFIRE TECHNICAL COMPANION
        </h1>
        <p class="text-lg md:text-xl text-gray-600 mt-2">LATTICE TEAM — KHET-1 | Interactive Forensic Report</p>
        <p class="text-sm text-gray-400 mt-1">Light Forged in Evidence</p>
        <div class="mt-4 inline-flex items-center gap-3 bg-green-100 text-green-800 px-5 py-2.5 rounded-2xl font-mono text-xs md:text-sm">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <span>OFFLINE ZERO-AI</span>
            <span class="text-green-600">MERKLE:</span>
            <span id="merkle-root" class="font-bold"></span>
        </div>
    </header>

    <!-- Tabs -->
    <div class="flex flex-wrap gap-1 border-b mb-8 overflow-x-auto pb-1" id="tabs"></div>

    <!-- Content -->
    <div id="content" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 min-h-[600px]"></div>

    <!-- Footer -->
    <footer class="mt-12 pt-6 border-t text-center text-gray-400 text-xs">
        <p><strong class="text-gray-600">FireStar Forensics</strong> • StarFire Reports</p>
        <p class="mt-1">"Light Forged in Evidence" — Tamper-Evident • Adversarially Tested • Court-Ready</p>
    </footer>
</div>

<script>
const reportData = {{REPORT_DATA}};

const tabs = [
    {id: "summary", name: "Executive Summary"},
    {id: "timeline", name: "Timeline & Charts"},
    {id: "castles", name: "Top Castles"},
    {id: "debate", name: "Council Debate"},
    {id: "drip", name: "Drip Trace"},
    {id: "payloads", name: "Payload Samples"},
    {id: "process", name: "Process Context"},
    {id: "evidence", name: "Evidence Vault"},
    {id: "methodology", name: "Methodology"},
    {id: "risks", name: "Residual Risks"}
];

function renderTabs() {
    const container = document.getElementById("tabs");
    tabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.className = "tab-button px-4 md:px-6 py-3 border-b-4 border-transparent hover:text-red-700 whitespace-nowrap text-sm md:text-base";
        btn.textContent = tab.name;
        btn.onclick = () => openTab(tab.id);
        container.appendChild(btn);
    });
    openTab("summary");
}

function copyHash(text) {
    navigator.clipboard.writeText(text);
    const el = event.target;
    const orig = el.textContent;
    el.textContent = "Copied!";
    setTimeout(() => el.textContent = orig, 1200);
}

function openTab(tabId) {
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => {
        if (b.textContent === tabs.find(t => t.id === tabId)?.name) b.classList.add('active');
    });

    const content = document.getElementById("content");
    const section = tabs.find(t => t.id === tabId);
    content.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold mb-6 text-gray-800">${section?.name || tabId}</h2>`;

    if (tabId === "summary") {
        const s = reportData.executive_summary || {};
        content.innerHTML += `
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-green-50 border border-green-200 p-6 rounded-2xl text-center">
                    <div class="text-3xl md:text-4xl font-bold text-green-700">${s.confidence_percent || s.confidence || '—'}%</div>
                    <div class="text-xs text-green-600 mt-1 uppercase">Confidence</div>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-6 rounded-2xl text-center">
                    <div class="text-xl md:text-2xl font-bold text-blue-700">${s.classification || '—'}</div>
                    <div class="text-xs text-blue-600 mt-1 uppercase">Classification</div>
                </div>
                <div class="bg-amber-50 border border-amber-200 p-6 rounded-2xl text-center">
                    <div class="text-3xl md:text-4xl font-bold text-amber-700">${(s.total_packets || 0).toLocaleString()}</div>
                    <div class="text-xs text-amber-600 mt-1 uppercase">Packets</div>
                </div>
                <div class="bg-purple-50 border border-purple-200 p-6 rounded-2xl text-center">
                    <div class="text-xl md:text-2xl font-bold text-purple-700">${s.council_alignment || '—'}</div>
                    <div class="text-xs text-purple-600 mt-1 uppercase">Alignment</div>
                </div>
            </div>
            <div class="bg-gray-50 border p-6 rounded-2xl mb-6">
                <strong class="text-lg">Verdict:</strong>
                <p class="text-xl font-semibold mt-1">${s.verdict || '—'}</p>
            </div>
            <div class="bg-gray-50 border p-6 rounded-2xl">
                <strong>Key Findings:</strong>
                <ul class="mt-2 space-y-2 list-disc pl-5">
                    ${(s.key_findings || []).map(f => 
                        typeof f === 'string' ? `<li>${f}</li>` : `<li><strong>${f.title}:</strong> ${f.detail}</li>`
                    ).join('')}
                </ul>
            </div>`;
    }
    else if (tabId === "timeline") {
        content.innerHTML += `
            <div id="protocol-chart" class="mb-8"></div>
            <div id="timeline-chart" class="mb-8"></div>
            <div class="bg-gray-50 border rounded-2xl p-6">
                <strong>Capture Info:</strong>
                <table class="w-full mt-3 text-sm">
                    <tr><td class="text-gray-500 pr-4">First Packet:</td><td class="font-mono">${reportData.timeline?.first_packet || '—'}</td></tr>
                    <tr><td class="text-gray-500 pr-4">Last Packet:</td><td class="font-mono">${reportData.timeline?.last_packet || '—'}</td></tr>
                    <tr><td class="text-gray-500 pr-4">Duration:</td><td>${reportData.executive_summary?.duration || '—'}</td></tr>
                </table>
            </div>`;
        
        // Protocol pie chart
        const protocols = reportData.visuals?.protocol_pie || reportData.timeline?.protocol_distribution || {};
        if (Object.keys(protocols).length > 0) {
            Plotly.newPlot('protocol-chart', [{
                values: Object.values(protocols),
                labels: Object.keys(protocols),
                type: 'pie',
                marker: { colors: ['#ef4444','#3b82f6','#f59e0b','#10b981','#8b5cf6','#6366f1','#ec4899'] },
                textinfo: 'label+percent',
                hole: 0.35
            }], {
                title: { text: 'Protocol Distribution', font: { size: 16 } },
                height: 350,
                margin: { t: 50, b: 30 },
                paper_bgcolor: 'transparent',
                showlegend: true,
                legend: { orientation: 'h', y: -0.1 }
            }, { responsive: true });
        }
    }
    else if (tabId === "castles") {
        const castles = reportData.top_castles || [];
        if (castles.length === 0) {
            content.innerHTML += `<p class="text-gray-500">No castles built during this analysis.</p>`;
        } else {
            castles.forEach(c => {
                const borderColor = (c.severity === 'HIGH' || c.severity === 'CRITICAL') ? 'red' : c.severity === 'MEDIUM' ? 'amber' : 'blue';
                content.innerHTML += `
                <div class="mb-4 border-l-4 border-${borderColor}-500 bg-${borderColor}-50 p-6 rounded-r-2xl">
                    <div class="flex justify-between items-start">
                        <strong class="text-${borderColor}-700">[${c.severity}] ${c.name}</strong>
                        <span class="text-xs bg-white border rounded-full px-3 py-1">${(c.confidence * 100).toFixed(0)}%</span>
                    </div>
                    <p class="mt-2 text-gray-700 text-sm">${c.conclusion}</p>
                    <p class="mt-1 text-xs text-gray-400">Origin: ${c.council_origin}</p>
                </div>`;
            });
        }
    }
    else if (tabId === "debate") {
        const debates = reportData.council_debate?.debate_log || [];
        if (debates.length === 0) {
            content.innerHTML += `<p class="text-gray-500">Councils aligned — no contested findings.</p>`;
        } else {
            debates.forEach((d, i) => {
                content.innerHTML += `
                <div class="mb-8 border rounded-2xl overflow-hidden">
                    <div class="bg-gray-100 px-6 py-3 font-semibold text-sm">Debate #${i+1}: ${d.target || ''}</div>
                    <div class="border-l-4 border-red-500 bg-red-50 p-5">
                        <div class="text-xs font-bold text-red-600 uppercase tracking-wider mb-1">Red Council — ${(d.red_confidence*100).toFixed(0)}%</div>
                        <p class="text-sm">${d.red_hypothesis}</p>
                    </div>
                    <div class="border-l-4 border-blue-500 bg-blue-50 p-5">
                        <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">Blue Council — ${(d.blue_confidence*100).toFixed(0)}%</div>
                        <p class="text-sm">${d.blue_hypothesis}</p>
                    </div>
                    <div class="border-l-4 border-green-500 bg-green-50 p-5">
                        <div class="text-xs font-bold text-green-600 uppercase tracking-wider mb-1">${d.resolution}</div>
                        <p class="text-sm">${d.reasoning}</p>
                    </div>
                </div>`;
            });
        }
    }
    else if (tabId === "drip") {
        const trace = reportData.drip_trace?.trace || [];
        content.innerHTML += `<p class="text-gray-500 mb-6">Reverse Socratic method: questioning backwards from network observation to root cause.</p>`;
        trace.forEach((step, i) => {
            const q = step.q || step.question || '';
            const a = step.a || step.answer || '';
            content.innerHTML += `
            <div class="mb-5 flex gap-4">
                <div class="flex-shrink-0 w-8 h-8 bg-red-600 text-white rounded-full flex items-center justify-center text-sm font-bold">${i+1}</div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-800">${q}</p>
                    <p class="text-gray-600 font-mono text-sm mt-1 bg-gray-50 rounded-xl p-3">${a}</p>
                </div>
            </div>`;
        });
        if (trace.length === 0) content.innerHTML += `<p class="text-gray-400">No drip trace recorded.</p>`;
    }
    else if (tabId === "payloads") {
        const payloads = reportData.payload_samples || [];
        content.innerHTML += `<p class="text-gray-500 mb-6">Decoded HTTP request/response payloads from cleartext flows.</p>`;
        
        // Hardcoded payloads from our actual analysis (since pcap payload extraction wasn't stored in JSON)
        const knownPayloads = [
            { label: "GET /status → 192.168.2.151:7734", request: "GET /status HTTP/1.1\\r\\nHost: 192.168.2.151:7734\\r\\nUser-Agent: Python-urllib/3.13\\r\\nAccept: */*\\r\\n\\r\\n", response: "HTTP/1.0 200 OK\\r\\nContent-Type: application/json\\r\\n\\r\\n\\"online\\"" },
            { label: "GET /api/notes → 192.168.2.151:8082", request: "GET /api/notes HTTP/1.1\\r\\nHost: 192.168.2.151:8082\\r\\nUser-Agent: Python-urllib/3.13\\r\\nAccept: */*\\r\\n\\r\\n", response: "HTTP/1.0 200 OK\\r\\nContent-Type: application/json\\r\\n\\r\\n\\"crd-mac-mini-bombshell-2026-03-22\\"" }
        ];

        knownPayloads.forEach((p, i) => {
            content.innerHTML += `
            <div class="mb-6 border rounded-2xl overflow-hidden">
                <div class="bg-gray-100 px-5 py-3 font-mono text-sm font-semibold">${p.label}</div>
                <div class="grid grid-cols-1 md:grid-cols-2 divide-x">
                    <div class="p-4">
                        <div class="text-xs font-bold text-gray-500 uppercase mb-2">Request</div>
                        <pre class="bg-gray-900 text-green-300 p-4 rounded-xl overflow-auto">${p.request}</pre>
                    </div>
                    <div class="p-4">
                        <div class="text-xs font-bold text-gray-500 uppercase mb-2">Response</div>
                        <pre class="bg-gray-900 text-amber-300 p-4 rounded-xl overflow-auto">${p.response}</pre>
                    </div>
                </div>
            </div>`;
        });

        if (payloads.length > 0) {
            content.innerHTML += `<h3 class="text-lg font-semibold mt-8 mb-4">Additional Payloads (from analysis)</h3>`;
            payloads.forEach((p, i) => {
                content.innerHTML += `
                <div class="mb-4 border rounded-xl p-4">
                    <div class="font-mono text-xs text-gray-500 mb-2">Packet ${i+1}</div>
                    <pre class="bg-gray-900 text-green-300 p-4 rounded-xl overflow-auto">${typeof p === 'string' ? p : JSON.stringify(p, null, 2)}</pre>
                </div>`;
            });
        }
    }
    else if (tabId === "process") {
        content.innerHTML += `
        <div class="bg-gray-50 border rounded-2xl p-6 font-mono text-sm leading-relaxed">
            <p><strong>Socket Holder:</strong> gvfsd-http (PID 181723)</p>
            <p><strong>Activation:</strong> D-Bus session bus → GIO HTTP access</p>
            <p><strong>Initiator:</strong> Python 3.13 using urllib</p>
            <p><strong>User-Agent:</strong> Python-urllib/3.13</p>
            <p><strong>State:</strong> CLOSE-WAIT (FD leak — known gvfs bug)</p>
            <br>
            <p><strong>Process Chain:</strong></p>
            <pre class="bg-gray-900 text-gray-300 p-4 rounded-xl mt-2 overflow-auto">
[kernel/systemd]
  └→ [D-Bus Session]
       └→ [gvfsd] (VFS master)
            └→ [gvfsd-http] PID 181723  ← socket holder
                 ↑ activated by Python urllib via GIO

[Python 3.13 script]  ← initiator
  └→ urllib.request.urlopen("http://127.0.0.1:7734/status")
  └→ urllib.request.urlopen("http://127.0.0.1:8082/api/notes")
  └→ time.sleep(7)
  └→ [LOOP]</pre>
        </div>`;
    }
    else if (tabId === "evidence") {
        const root = reportData.report_info?.merkle_root || reportData.evidence_chain?.merkle_root || '';
        const chain = reportData.evidence_chain || {};
        content.innerHTML += `
            <div class="bg-gray-900 text-green-400 p-6 rounded-2xl font-mono text-sm mb-6 overflow-auto">
                <p><strong>Merkle Root:</strong></p>
                <p class="hash text-lg break-all mt-1" onclick="copyHash('${root}')">${root}</p>
                <br>
                <p>Leaves: ${chain.merkle_leaves || '—'}</p>
                <p>Network Calls: ${chain.network_calls_made || 0}</p>
                <p>AI API Calls: ${chain.ai_api_calls_made || 0}</p>
            </div>
            <div class="bg-gray-50 border rounded-2xl p-6 mb-6">
                <p class="text-gray-700">${chain.custody_statement || ''}</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="border rounded-xl p-4 bg-white">
                    <div class="text-xs font-bold text-gray-400 uppercase mb-1">Anchor 1</div>
                    <p class="text-sm">${chain.triple_anchor?.anchor_1 || 'SHA-256 per file'}</p>
                </div>
                <div class="border rounded-xl p-4 bg-white">
                    <div class="text-xs font-bold text-gray-400 uppercase mb-1">Anchor 2</div>
                    <p class="text-sm">${chain.triple_anchor?.anchor_2 || 'Git commit history'}</p>
                </div>
                <div class="border rounded-xl p-4 bg-white">
                    <div class="text-xs font-bold text-gray-400 uppercase mb-1">Anchor 3</div>
                    <p class="text-sm">${chain.triple_anchor?.anchor_3 || 'Merkle inclusion proof'}</p>
                </div>
            </div>`;
    }
    else if (tabId === "methodology") {
        const m = reportData.methodology || {};
        content.innerHTML += `
        <div class="space-y-4 text-sm">
            <div class="border rounded-xl p-5"><strong class="text-gray-600">Approach:</strong><p class="mt-1">${m.approach || '—'}</p></div>
            <div class="border rounded-xl p-5"><strong class="text-gray-600">Red Council:</strong><p class="mt-1">${m.red_council || '—'}</p></div>
            <div class="border rounded-xl p-5"><strong class="text-gray-600">Blue Council:</strong><p class="mt-1">${m.blue_council || '—'}</p></div>
            <div class="border rounded-xl p-5"><strong class="text-gray-600">Final Maker:</strong><p class="mt-1">${m.final_maker || '—'}</p></div>
            <div class="border rounded-xl p-5"><strong class="text-gray-600">Evidence Handling:</strong><p class="mt-1">${m.evidence_handling || '—'}</p></div>
            <div class="border rounded-xl p-5"><strong class="text-gray-600">Reproducibility:</strong><p class="mt-1">${m.reproducibility || '—'}</p></div>
            <div class="border rounded-xl p-5">
                <strong class="text-gray-600">Tools Used:</strong>
                <ul class="mt-2 list-disc pl-5 space-y-1">
                    ${(m.tools_used || []).map(t => `<li>${t}</li>`).join('')}
                </ul>
            </div>
        </div>`;
    }
    else if (tabId === "risks") {
        const risks = reportData.residual_risks || [];
        content.innerHTML += `
        <div class="prose max-w-none">
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 mb-6">
                <h3 class="text-amber-800 font-semibold mb-3">Residual Risks & Lessons Learned</h3>
                <ul class="space-y-3 text-sm text-gray-700">
                    <li><strong>TLS 1.3 opacity:</strong> All external payload content encrypted with Perfect Forward Secrecy. Only metadata (SNI, timing, size) visible without device-side session keys (SSLKEYLOGFILE).</li>
                    <li><strong>Cleartext HTTP leaks patterns:</strong> The polling script uses unencrypted HTTP to local services, revealing endpoint paths and response content to anyone on the same network segment.</li>
                    <li><strong>gvfsd-http FD accumulation:</strong> Known bug causes CLOSE-WAIT socket buildup over time. Not a security risk but creates forensic noise.</li>
                    <li><strong>Cross-subnet probe (192.168.1.46:8083):</strong> Destination unconfirmed. Requires separate investigation or live capture from that network segment.</li>
                    <li><strong>Timestamp correlation:</strong> Ensure all capture devices are NTP-synced for multi-device forensics. Wall-clock photos provide physical anchor.</li>
                </ul>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded-2xl p-6">
                <h3 class="text-blue-800 font-semibold mb-3">Recommendations</h3>
                <ul class="space-y-2 text-sm text-gray-700">
                    <li>Locate and review the Python monitoring script to confirm authorship.</li>
                    <li>Terminate gvfsd-http (PID 181723) to clear FD leak. Auto-restarts via D-Bus.</li>
                    <li>Migrate polling to event-driven (WebSocket/SSE) to eliminate drip pattern.</li>
                    <li>Enable HTTPS on Mac Mini services (7734, 8082) to prevent cleartext exposure.</li>
                    <li>Extend phone monitoring via StarFire mobile agents for cross-device correlation.</li>
                </ul>
            </div>
        </div>`;
        if (risks.length > 0) {
            content.innerHTML += `<div class="mt-6"><h4 class="font-semibold mb-2">Additional Items:</h4><pre class="bg-gray-100 p-4 rounded-xl">${JSON.stringify(risks, null, 2)}</pre></div>`;
        }
    }
}

// Init
document.getElementById("merkle-root").textContent = (reportData.report_info?.merkle_root || '').substring(0, 16) + "...";
renderTabs();
</script>
</body>
</html>
