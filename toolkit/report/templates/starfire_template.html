<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StarFire Report — Light Forged in Evidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        .tab-button { transition: all 0.2s; }
        .tab-button.active { border-bottom: 4px solid #b91c1c; font-weight: 700; color: #b91c1c; }
        .starfire-header { background: linear-gradient(135deg, #450a0a, #7f1d1d); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

<div class="max-w-7xl mx-auto p-8">

    <!-- Branded Header -->
    <header class="starfire-header text-white rounded-3xl p-10 mb-10 text-center">
        <div class="flex items-center justify-center gap-4 mb-4">
            <span class="text-6xl">🔥</span>
            <h1 class="text-6xl font-bold tracking-tighter">STARFIRE</h1>
        </div>
        <p class="text-2xl font-light">Reports</p>
        <p class="text-red-200 mt-2 text-lg">Light Forged in Evidence</p>
        <div class="mt-6 inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full font-mono text-sm">
            LATTICE TEAM — KHET-1 • OFFLINE ZERO-AI MODE
        </div>
    </header>

    <!-- Report Metadata -->
    <div class="flex justify-between items-center mb-8 text-sm text-gray-500">
        <div>Generated: <span id="timestamp" class="font-mono"></span></div>
        <div class="font-mono text-red-700">MERKLE ROOT: <span id="merkle-root" class="font-semibold"></span></div>
    </div>

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 border-b mb-8 pb-2" id="tabs"></div>

    <!-- Content Area -->
    <div id="content" class="bg-white shadow-xl rounded-3xl p-10 min-h-[700px] prose prose-lg max-w-none"></div>

    <!-- Branded Footer -->
    <footer class="mt-16 pt-8 border-t text-center text-gray-500 text-sm">
        <p>Generated by <strong>FireStar Forensics</strong> • StarFire Reports</p>
        <p class="mt-1">"Light Forged in Evidence" — Tamper-Evident • Adversarially Tested • Court-Ready</p>
        <p class="mt-4 font-mono text-xs">Vault Integrity Verified • Merkle Root Sealed</p>
    </footer>
</div>

<script>
const reportData = {{REPORT_DATA}};

const tabs = [
    {id: "summary", name: "Executive Summary"},
    {id: "timeline", name: "Timeline & Visuals"},
    {id: "castles", name: "Top Castles"},
    {id: "debate", name: "Council Debate"},
    {id: "drip", name: "Drip Trace"},
    {id: "payloads", name: "Payload Samples"},
    {id: "process", name: "Process Context"},
    {id: "evidence", name: "Evidence Vault"}
];

function renderTabs() {
    const container = document.getElementById("tabs");
    tabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.className = "tab-button px-8 py-4 border-b-4 border-transparent hover:text-red-700 text-lg";
        btn.textContent = tab.name;
        btn.onclick = () => openTab(tab.id);
        container.appendChild(btn);
    });
    openTab("summary");
}

function openTab(tabId) {
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    const activeBtn = Array.from(document.querySelectorAll('.tab-button')).find(b => 
        b.textContent === tabs.find(t => t.id === tabId).name
    );
    if (activeBtn) activeBtn.classList.add('active');

    const content = document.getElementById("content");
    content.innerHTML = `<h2 class="text-3xl font-bold mb-8 text-red-800">${tabs.find(t => t.id === tabId).name}</h2>`;

    if (tabId === "summary") {
        content.innerHTML += `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-green-50 border border-green-200 p-8 rounded-3xl">
                    <strong class="block text-green-700">Classification</strong>
                    <div class="text-4xl font-bold mt-2">${reportData.executive_summary.classification}</div>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-8 rounded-3xl">
                    <strong class="block text-blue-700">Confidence</strong>
                    <div class="text-4xl font-bold mt-2">${reportData.executive_summary.confidence_percent}%</div>
                </div>
                <div class="bg-amber-50 border border-amber-200 p-8 rounded-3xl">
                    <strong class="block text-amber-700">Packets Analyzed</strong>
                    <div class="text-4xl font-bold mt-2">${reportData.executive_summary.total_packets.toLocaleString()}</div>
                </div>
            </div>
            <div class="mt-8 bg-gray-50 border p-6 rounded-2xl">
                <strong class="text-lg">Verdict:</strong>
                <p class="text-2xl font-semibold mt-2">${reportData.executive_summary.verdict}</p>
                <p class="text-sm text-gray-500 mt-2">Council Alignment: ${reportData.executive_summary.council_alignment}</p>
            </div>`;
    } else if (tabId === "evidence") {
        content.innerHTML += `
            <div class="bg-gray-900 text-green-400 p-8 rounded-3xl font-mono text-sm overflow-auto">
                <strong>Merkle Root:</strong><br>
                ${reportData.report_info.merkle_root}<br><br>
                <strong>Mode:</strong> ${reportData.report_info.mode}<br>
                <strong>Network Calls:</strong> ${reportData.evidence_chain.network_calls_made}<br>
                <strong>AI API Calls:</strong> ${reportData.evidence_chain.ai_api_calls_made}<br><br>
                <strong>Custody Statement:</strong><br>
                ${reportData.evidence_chain.custody_statement}
            </div>
            <div class="mt-6 bg-gray-50 border p-6 rounded-2xl">
                <strong>Triple Anchor Verification:</strong>
                <ul class="mt-2 space-y-1 text-sm">
                    <li><strong>Anchor 1:</strong> ${reportData.evidence_chain.triple_anchor.anchor_1}</li>
                    <li><strong>Anchor 2:</strong> ${reportData.evidence_chain.triple_anchor.anchor_2}</li>
                    <li><strong>Anchor 3:</strong> ${reportData.evidence_chain.triple_anchor.anchor_3}</li>
                </ul>
            </div>`;
    } else if (tabId === "debate") {
        const debates = reportData.council_debate?.debate_log || [];
        if (debates.length === 0) {
            content.innerHTML += `<p class="text-gray-500">Councils aligned — no contested findings.</p>`;
        } else {
            debates.forEach(d => {
                content.innerHTML += `
                <div class="mb-6 border rounded-2xl overflow-hidden">
                    <div class="bg-red-50 p-6 border-b border-l-4 border-l-red-500">
                        <strong class="text-red-700">RED COUNCIL:</strong> ${d.red_hypothesis}
                        <span class="float-right text-sm text-gray-500">conf: ${(d.red_confidence*100).toFixed(0)}%</span>
                    </div>
                    <div class="bg-blue-50 p-6 border-b border-l-4 border-l-blue-500">
                        <strong class="text-blue-700">BLUE COUNCIL:</strong> ${d.blue_hypothesis}
                        <span class="float-right text-sm text-gray-500">conf: ${(d.blue_confidence*100).toFixed(0)}%</span>
                    </div>
                    <div class="bg-green-50 p-6 border-l-4 border-l-green-500">
                        <strong class="text-green-700">${d.resolution}:</strong> ${d.reasoning}
                    </div>
                </div>`;
            });
        }
    } else if (tabId === "drip") {
        const trace = reportData.drip_trace?.trace || [];
        if (trace.length === 0) {
            content.innerHTML += `<p class="text-gray-500">No drip trace performed.</p>`;
        } else {
            trace.forEach((step, i) => {
                const q = step.q || step.question || '';
                const a = step.a || step.answer || '';
                content.innerHTML += `
                <div class="mb-4 pl-6 border-l-4 border-orange-400">
                    <p class="font-bold">Q${i+1}: ${q}</p>
                    <p class="text-gray-600 font-mono text-sm mt-1">${a}</p>
                </div>`;
            });
        }
    } else if (tabId === "castles") {
        const castles = reportData.top_castles || [];
        if (castles.length === 0) {
            content.innerHTML += `<p class="text-gray-500">No castles built.</p>`;
        } else {
            castles.forEach(c => {
                const color = c.severity === 'HIGH' || c.severity === 'CRITICAL' ? 'red' : c.severity === 'MEDIUM' ? 'amber' : 'blue';
                content.innerHTML += `
                <div class="mb-4 border border-${color}-200 bg-${color}-50 p-6 rounded-2xl">
                    <strong class="text-${color}-700">[${c.severity}] ${c.name}</strong>
                    <p class="mt-2 text-gray-700">${c.conclusion}</p>
                    <p class="mt-1 text-sm text-gray-500">Confidence: ${(c.confidence*100).toFixed(0)}% | Origin: ${c.council_origin}</p>
                </div>`;
            });
        }
    } else {
        const sectionData = reportData[tabId] || reportData[tabId + '_context'] || {};
        content.innerHTML += `<pre class="bg-gray-100 p-8 rounded-3xl overflow-auto text-sm">${JSON.stringify(sectionData, null, 2)}</pre>`;
    }
}

// Populate metadata
document.getElementById("timestamp").textContent = reportData.report_info.generated;
document.getElementById("merkle-root").textContent = reportData.report_info.merkle_root.substring(0, 24) + "...";

renderTabs();
</script>
</body>
</html>
