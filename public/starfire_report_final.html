function renderTabs() {
    var container = document.getElementById("tabs");
    for (var i = 0; i < tabs.length; i++) {
        var btn = document.createElement("button");
        btn.className = "tab-button px-3 md:px-5 py-3 border-b-4 border-transparent hover:text-red-700 whitespace-nowrap text-sm";

        btn.setAttribute("data-tab", tabs[i].id);
        btn.onclick = function() { openTab(this.getAttribute("data-tab")); };
        container.appendChild(btn);
    }
    openTab("finding");
}

function openTab(tabId) {
    var buttons = document.querySelectorAll('.tab-button');
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
        if (buttons[i].getAttribute("data-tab") === tabId) buttons[i].classList.add('active');
    }
    var content = document.getElementById("content");
    var tabName = "";
    for (var i = 0; i < tabs.length; i++) { if (tabs[i].id === tabId) tabName = tabs[i].name; }
    content.innerHTML = '<h2 class="text-2xl font-bold mb-6 text-gray-800">' + tabName + '</h2>';

    if (tabId === "finding") {
        var f = reportData.primary_finding;
        content.innerHTML += '<div class="bg-red-50 border border-red-200 rounded-2xl p-6 mb-6">' +
            '<h3 class="text-xl font-bold text-red-800 mb-3">' + f.title + '</h3>' +

            '<div class="border rounded-xl p-4"><strong class="text-xs text-gray-500 uppercase">Destination</strong><p class="mt-1 text-sm font-mono">' + f.destination + '</p></div>' +
            '<div class="border rounded-xl p-4"><strong class="text-xs text-gray-500 uppercase">Is Malware?</strong><p class="mt-1 text-sm">' + f.is_malware + '</p></div>' +
            '<div class="border rounded-xl p-4"><strong class="text-xs text-gray-500 uppercase">User Informed?</strong><p class="mt-1 text-sm font-bold text-red-700">' + f.user_informed + '</p></div>' +
            '</div>' +
            '<div class="mt-6 bg-gray-50 border rounded-xl p-4"><strong class="text-xs text-gray-500 uppercase">Content At Risk</strong><p class="mt-1">' + f.content_at_risk + '</p></div>' +

    }
    else if (tabId === "evidence") {
        var e = reportData.evidence;
        content.innerHTML += '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">' +
